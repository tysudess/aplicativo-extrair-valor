name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-LAYOUT-MODERNO-AUTO-HD.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Layout Moderno + Automático HD
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Nova interface moderna do Extrator Valor, preservando integralmente o motor automático HD aprovado.

            - Dashboard moderno inspirado na prévia aprovada.
            - Cartão de próxima execução às 04:00 e status da automação.
            - Indicadores separados para Página 1, Página 2 e Página 3.
            - Mostra resolução HD obtida durante a geração manual.
            - Resumo da última execução e do envio dos 3 anexos.
            - Botão principal GERAR AGORA.
            - Controle visual da automação 04:00 Seg–Sex.
            - PressReader continua integrado em tela própria para login/revisão.
            - Configurações, envio manual e diagnóstico ficam organizados em painel separado.
            - Mantém mínimo de 1800 px de largura por página no motor HD.
            - Mantém tentativas automáticas 04:10 / 04:20 / 04:30 quando necessário.
            - Sábado e domingo não executa.
            - Mantém 3 PDFs separados no mesmo e-mail.
            - Destino: imprensa30.monitoramento@gmail.com
            - Assunto: Monitoramento: CAPAS DE JORNAIS
            - Apps Script permanece integrado.

            Após instalar, confirme o APP_SECRET e mantenha a automação 04:00 ativa.
          files: dist/*.apk
