name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar correções v0.7.1
        run: python3 scripts/patch_v071.py

      - name: Aplicar correções v0.7.2
        run: python3 scripts/patch_v072.py

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-DISPARO-DIRETO-DIAGNOSTICO-AUTO-HD.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Disparo Direto + Diagnóstico + Auto HD
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Correção do disparo automático em segundo plano e diagnóstico do agendamento.

            - AlarmManager agora dispara diretamente o serviço automático em primeiro plano.
            - Remove a dependência do BroadcastReceiver intermediário para o alarme principal e retries.
            - Mantém horário automático configurável; 04:00 continua sendo o padrão.
            - Mantém tentativas +10 / +20 / +30 minutos.
            - Continua sem executar sábado e domingo.
            - Adiciona TESTAR AUTOMÁTICO EM 2 MIN em Configurações.
            - Registra Último disparo e Último resultado no painel de Configurações.
            - Mostra a data/hora real do próximo disparo programado.
            - Teste automático não bloqueia o envio automático normal do mesmo dia.
            - Mantém GERAR AGORA em HD sem abrir previamente a tela do Valor.
            - Mantém ícone próprio, 3 PDFs separados e envio pelo Apps Script/Gmail.
            - Mantém mínimo de 1800 px por página.

            Para validar, ative a automação, abra Configurações e toque TESTAR AUTOMÁTICO EM 2 MIN. Feche o app e confira depois Último disparo e Último resultado.
          files: dist/*.apk
