name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-AUTO-04H-SEG-SEX-HD.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Automático 04:00 Seg–Sex HD
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Correção de qualidade do modo automático das 04:00.

            - O modo automático passa a pré-renderizar o PressReader fora da tela em viewport grande.
            - Aguarda mais tempo para os recursos de alta resolução carregarem antes do download.
            - Prioriza URLs autorizadas de imagem em maior qualidade.
            - Testa escalas e larguras maiores antes de montar os PDFs.
            - Não aceita mais imagem pequena apenas porque foi a melhor disponível naquele momento.
            - Exige no mínimo 1800 px de largura em cada uma das três páginas.
            - Se P1, P2 ou P3 ficar abaixo da qualidade mínima, não envia o e-mail e agenda nova tentativa.
            - Mantém execução às 04:00, somente de segunda a sexta-feira.
            - Mantém novas tentativas às 04:10, 04:20 e 04:30 quando necessário.
            - Sábado e domingo não executa.
            - Mantém 3 PDFs separados no mesmo e-mail.
            - Destino: imprensa30.monitoramento@gmail.com
            - Assunto: Monitoramento: CAPAS DE JORNAIS

            Após atualizar o APK, mantenha ATIVAR AUTO 04:00 habilitado e o APP_SECRET salvo.
          files: dist/*.apk
