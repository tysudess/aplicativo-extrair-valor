name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-ALTA-QUALIDADE-3-PDFS-GMAIL.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — 3 PDFs separados + Gmail
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Versão v0.5 mantendo a alta qualidade aprovada da v0.4 e alterando a saída para arquivos separados.

            - Mantém a busca HD das páginas 1, 2 e 3.
            - Gera três PDFs separados:
              - Valor-Economico-AAAA-MM-DD-Pagina-1.pdf
              - Valor-Economico-AAAA-MM-DD-Pagina-2.pdf
              - Valor-Economico-AAAA-MM-DD-Pagina-3.pdf
            - Salva os três arquivos em Downloads/ExtratorValor.
            - Envia os três PDFs como anexos separados em um único e-mail do Gmail.
            - O Apps Script v0.5 aceita os três anexos no mesmo POST.
            - Mantém tickets e credenciais da sessão apenas em memória.
            - Preserva o modo de diagnóstico sanitizado.

            Para o envio automático, atualize/reimplante o Apps Script com o arquivo apps-script-Code.gs desta versão e mantenha DEST_EMAIL e APP_SECRET configurados nas Script Properties.
          files: dist/*.apk
