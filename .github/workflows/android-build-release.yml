name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-ALTA-QUALIDADE.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Alta Qualidade
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Versão focada em melhorar significativamente a definição das páginas 1, 2 e 3.

            - Testa escalas maiores no PressReader/PRCDN: 312, 286, 260, 234, 208 e demais fallbacks.
            - Testa também larguras explícitas de até 2800 px quando o endpoint autorizado aceita esse modo.
            - Mede a imagem realmente recebida e mantém a opção de maior resolução.
            - Busca aproximadamente 2000 px de largura ou mais por página quando disponibilizado pela sessão autorizada.
            - A melhoria vale para a página 1, página 2 e página 3.
            - Mantém tickets e credenciais apenas em memória.
            - Continua gerando um único PDF em Downloads/ExtratorValor.
            - Preserva a configuração de envio por Apps Script/Gmail.

            Se o servidor limitar uma página, o app testa todas as variantes HD antes de usar a melhor disponível.
          files: dist/*.apk
