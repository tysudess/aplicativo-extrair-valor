name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-CALIBRACAO.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Calibração
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Primeira versão de calibração do Extrator Valor Android.

            - Abre o Valor Econômico no PressReader usando a sessão normal autorizada do aparelho.
            - Permite marcar as páginas 1, 2 e 3.
            - Exporta um diagnóstico sanitizado para identificar o método correto de obtenção das páginas.
            - Não exporta cookies, senhas ou cabeçalhos de autenticação.

            Após o teste, envie o TXT gerado pelo app para avançarmos para a extração automática + PDF + envio por e-mail.
          files: dist/*.apk
