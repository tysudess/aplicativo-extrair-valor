name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-PDF-AUTOMATICO.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — PDF automático
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Terceira etapa do Extrator Valor Android.

            - Usa a sessão autorizada do PressReader já aberta no WebView.
            - Navega automaticamente pelas páginas 1, 2 e 3 da edição atual.
            - Identifica internamente as URLs reais das imagens do PressReader/PRCDN.
            - Mantém tickets e credenciais somente em memória e não os exporta no diagnóstico.
            - Baixa a melhor imagem autorizada disponível para cada página.
            - Gera um PDF único em Downloads/ExtratorValor.
            - Permite configurar um Web App do Google Apps Script para enviar o PDF automaticamente por Gmail.
            - Mantém o modo de diagnóstico sanitizado para ajustes futuros.

            Para o envio automático por Gmail, configure DEST_EMAIL e APP_SECRET nas Script Properties do Apps Script e informe no app a URL do Web App e o mesmo APP_SECRET.
          files: dist/*.apk
