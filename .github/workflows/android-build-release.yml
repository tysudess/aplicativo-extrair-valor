name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar correções v0.7.1
        run: python3 scripts/patch_v071.py

      - name: Aplicar correções v0.7.2
        run: python3 scripts/patch_v072.py

      - name: Aplicar correções v0.7.3
        run: python3 scripts/patch_v073.py

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-AUTO-PAGINA-INTEIRA-HD-DIAGNOSTICO.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Automático Página Inteira HD + Diagnóstico
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Correção do automático após diagnóstico real de miniatura 417x417.

            - Mantém o disparo direto do AlarmManager para o serviço automático.
            - Mantém horário configurável e TESTAR AUTOMÁTICO EM 2 MIN.
            - Mantém Último disparo e Último resultado.
            - Rejeita miniaturas/tiles quadrados e recursos com proporção incompatível com página de jornal.
            - Remove top/left/height/width e outros parâmetros de recorte ao promover uma URL autorizada para página inteira HD.
            - Guarda vários candidatos por página e tenta alternativas antes de falhar.
            - Aumenta o viewport e o tempo de aquecimento do WebView automático.
            - Mantém mínimo de 1800 px de largura por página.
            - Mantém 3 PDFs separados e envio pelo Apps Script/Gmail.
            - Mantém execução somente de segunda a sexta-feira.

            Após instalar, use TESTAR AUTOMÁTICO EM 2 MIN e confira Último disparo/Último resultado.
          files: dist/*.apk
