name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-AUTO-04H-SEG-SEX.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Automático 04:00 Seg–Sex
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Versão automática do Extrator Valor Android.

            - Mantém a alta qualidade das páginas 1, 2 e 3.
            - Mantém os três PDFs separados no mesmo e-mail do Gmail.
            - Execução automática às 04:00, somente de segunda a sexta-feira.
            - Sábado e domingo não executa e não envia e-mail.
            - Se a edição ainda não estiver disponível, tenta novamente às 04:10, 04:20 e 04:30.
            - Nunca envia se não localizar corretamente as três páginas da edição do dia.
            - Reagenda o próximo dia útil após cada execução.
            - Reprograma o alarme depois de reiniciar o aparelho ou atualizar o aplicativo.
            - Usa serviço em primeiro plano para continuar o processamento com a tela apagada.
            - Apps Script já integrado ao aplicativo.
            - Destino: imprensa30.monitoramento@gmail.com
            - Assunto: Monitoramento: CAPAS DE JORNAIS

            Após instalar, abra o app uma vez, confirme o APP_SECRET e toque em ATIVAR AUTO 04:00.
            Em Android 12 ou superior, autorize o acesso especial a Alarmes e lembretes quando solicitado.
          files: dist/*.apk
