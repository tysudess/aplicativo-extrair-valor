name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar correções v0.7.1
        run: python3 scripts/patch_v071.py

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-HORARIO-CONFIGURAVEL-ICONE-AUTO-HD.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Horário configurável + Ícone + Auto HD
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Evolução do layout moderno com melhorias para testes e uso automático.

            - Novo ícone próprio do Extrator Valor no Android.
            - Horário da geração automática agora pode ser escolhido pelo usuário.
            - 04:00 permanece como horário padrão.
            - Ao alterar o horário, o alarme é reagendado imediatamente.
            - Tentativas automáticas passam a ocorrer em +10, +20 e +30 minutos a partir do horário escolhido.
            - Continua sem executar aos sábados e domingos.
            - Corrige GERAR AGORA no dashboard: o WebView é pré-renderizado em HD mesmo sem abrir a tela do Valor antes.
            - Mantém mínimo de 1800 px de largura por página.
            - Mantém as páginas 1, 2 e 3 em PDFs separados.
            - Mantém envio no mesmo e-mail pelo Apps Script.
            - Destino: imprensa30.monitoramento@gmail.com
            - Assunto: Monitoramento: CAPAS DE JORNAIS
            - Mantém login/sessão autorizada do PressReader.

            Para testar, abra Configurações > Escolher horário automático e selecione um horário alguns minutos à frente.
          files: dist/*.apk
