name: Android Build + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar versão
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName\\s+'\\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExtratorValor-Android-v${VERSION}-CALIBRACAO-AMPLIADA.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Extrator Valor Android v${{ env.VERSION }} — Calibração ampliada
          target_commitish: main
          make_latest: true
          overwrite_files: true
          body: |
            Segunda etapa de calibração do Extrator Valor Android.

            - Identifica a edição e as páginas 1, 2 e 3 do Valor Econômico no PressReader.
            - Captura recursos vistos pelo WebView via shouldInterceptRequest e onLoadResource.
            - Observa requisições de Service Worker.
            - Coleta recursos já carregados pela página usando a Performance API do JavaScript.
            - Inclui domínios CDN do PressReader/PRCDN no diagnóstico.
            - Não exporta cookies, senhas ou cabeçalhos de autenticação.
            - Tokens, tickets e parâmetros sensíveis permanecem ocultados.

            Após o teste, envie o novo TXT gerado pelo app para identificarmos a URL/estrutura de imagem das páginas e avançarmos para PDF + envio automático por e-mail.
          files: dist/*.apk
